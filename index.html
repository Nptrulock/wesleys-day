  <style>
    :root {
      --sky: #7EC8F8;
      --sun: #FFE566;
      --peach: #FFD6A5;
      --coral: #FF6B6B;
      --ink: #1F3A5F;
      --ink-soft: #3D5A80;
      --card: #FFFFFF;
      --shadow: 0 10px 0 rgba(31, 58, 95, 0.12);
      --radius: 28px;
      --bg-top: #6EC7F8;
      --bg-mid: #B8E4FF;
      --bg-sun: #FFF3A8;
      --bg-bottom: #FFD6A5;
    }
    body.season-fall {
      --bg-top: #E39A3C;
      --bg-mid: #F3C27A;
      --bg-sun: #FFE5B4;
      --bg-bottom: #E07A45;
    }
    body.season-winter {
      --bg-top: #7BA3C9;
      --bg-mid: #C5D9EC;
      --bg-sun: #F2F6FB;
      --bg-bottom: #A9BDD2;
    }
    body.season-spring {
      --bg-top: #7EC9A0;
      --bg-mid: #C8F0B8;
      --bg-sun: #FFF4C4;
      --bg-bottom: #F5C0D4;
    }
    body.season-summer {
      --bg-top: #3EB0F0;
      --bg-mid: #8ED8FF;
      --bg-sun: #FFE566;
      --bg-bottom: #FFC078;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 28%, var(--bg-sun) 68%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    }

    .app { max-width: 980px; margin: 0 auto; position: relative; z-index: 1; }

    /* ---- Tap to start overlay ---- */
    .unlock {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-sun) 65%, var(--bg-bottom) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
    }
    .unlock.hide {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .unlock-btn {
      border: 0;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      font-size: clamp(28px, 5.5vw, 44px);
      padding: 32px 40px;
      border-radius: 40px;
      box-shadow: 0 14px 0 rgba(31, 58, 95, 0.14);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 260px;
    }
    .unlock-btn:active { transform: scale(0.97); }
    .unlock-btn .speaker { font-size: 84px; line-height: 1; }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .nav-btn {
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      font-size: 36px;
      line-height: 1;
      box-shadow: var(--shadow);
      cursor: pointer;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .nav-btn:active { transform: scale(0.92); background: var(--sun); }

    .title-wrap { text-align: center; flex: 1; min-width: 0; }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    }

    .today-btn {
      display: none;
      margin: 8px auto 0;
      border: 0;
      background: var(--coral);
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 999px;
      box-shadow: 0 4px 0 #d94d4d;
      cursor: pointer;
    }
    .today-btn.show { display: inline-block; }
    .today-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d94d4d; }

    .days { display: flex; flex-direction: column; gap: 20px; }

    .day-panel {
      background: rgba(255,255,255,0.42);
      border-radius: 36px;
      padding: 18px 16px 18px;
      backdrop-filter: blur(8px);
    }
    .day-panel.tomorrow-panel { background: rgba(255,255,255,0.3); }

    .day-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .day-labels { flex: 1; min-width: 0; }

    .when {
      display: block;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 2px;
    }

    .day-name {
      display: block;
      width: 100%;
      text-align: left;
      font-size: clamp(52px, 11vw, 100px);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-shadow: 0 3px 0 rgba(255,255,255,0.75);
      margin: 0;
    }

    .day-name.sunday { color: #F15BB5; }
    .day-name.monday { color: #00A8E8; }
    .day-name.tuesday { color: #9B5DE5; }
    .day-name.wednesday { color: #12B886; }
    .day-name.thursday { color: #3A6FF7; }
    .day-name.friday { color: #FF7A00; }
    .day-name.saturday { color: #E63946; }

    .date-line {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 700;
      color: var(--ink-soft);
      margin: 8px 0 10px;
    }

    .speak-btn {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      background: #FFF176;
      box-shadow: 0 8px 0 #E8C200;
      font-size: 38px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .speak-btn:active, .speak-btn.playing {
      transform: scale(0.94);
      background: #FFE566;
    }
    .speak-btn.playing { animation: pulse 0.8s ease infinite; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .weather {
      display: none;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.7);
      border-radius: 22px;
      padding: 8px 12px 8px 8px;
      margin: 0 0 14px;
      box-shadow: 0 4px 0 rgba(31, 58, 95, 0.08);
    }
    .weather.show { display: flex; }
    .wx-emoji {
      border: 0;
      background: transparent;
      font-size: 42px;
      line-height: 1;
      width: 56px;
      height: 56px;
      cursor: pointer;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
    }
    .wx-emoji:active { transform: scale(0.92); }
    .weather .dot {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink-soft);
      padding: 0 4px;
    }
    .weather .word { font-size: clamp(22px, 3.4vw, 28px); }

    .cards { display: flex; flex-direction: column; gap: 14px; }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-height: 108px;
      box-shadow: var(--shadow);
      border: 4px solid transparent;
    }
    .card.swim { border-color: #7EC8F8; }
    .card.work { border-color: #FFD166; }
    .card.paperplane { border-color: #80E0C8; }
    .card.babysitter { border-color: #FFB4D0; }
    .card.feeding { border-color: #FFB347; }
    .card.family, .card.daddy { border-color: #FF8FAB; }
    .card.church { border-color: #C9B6FF; }

    .icon-btn {
      width: 84px;
      height: 84px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 64px;
      line-height: 1;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 20px;
      transform-origin: center center;
      will-change: transform;
      font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
    }
    .icon-btn:active { background: rgba(31, 58, 95, 0.06); }

    .label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 0;
      font-size: clamp(24px, 3.8vw, 32px);
      font-weight: 800;
      line-height: 1.2;
      color: var(--ink);
    }

    .word {
      display: inline-block;
      border: 0;
      background: transparent;
      font: inherit;
      font-weight: 800;
      color: inherit;
      cursor: pointer;
      padding: 6px 7px;
      margin: 0;
      border-radius: 12px;
      line-height: 1.15;
      position: relative;
      z-index: 2;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }
    .word:active, .word.tapped {
      background: #FFF3A0;
      box-shadow: 0 0 0 4px rgba(255, 225, 80, 0.85);
    }
    @keyframes wordpop {
      0% { transform: scale(1); }
      40% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    .word.tapped, .letter.tapped { animation: wordpop 0.32s ease; }
    .when.word, .date-line .word {
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      padding: 2px 4px;
    }
    .day-name.word {
      padding: 0;
      background: transparent;
    }
    .day-name.word:active { transform: scale(0.98); opacity: 0.9; }

    /* Activity animations */
    .anim-splash { animation: splash 0.8s ease; }
    @keyframes splash {
      0% { transform: translateY(0) scale(1) rotate(0); }
      18% { transform: translateY(-22px) scale(1.18) rotate(-10deg); }
      36% { transform: translateY(8px) scale(0.92, 1.08) rotate(10deg); }
      54% { transform: translateY(-14px) scale(1.12) rotate(-6deg); }
      72% { transform: translateY(4px) scale(1.02) rotate(4deg); }
      100% { transform: translateY(0) scale(1) rotate(0); }
    }
    .anim-ring { animation: ring 0.9s ease; transform-origin: 50% 0%; }
    @keyframes ring {
      0%, 100% { transform: rotate(0); }
      12% { transform: rotate(18deg); }
      28% { transform: rotate(-16deg); }
      44% { transform: rotate(12deg); }
      60% { transform: rotate(-8deg); }
      76% { transform: rotate(4deg); }
    }
    .anim-type { animation: type 0.7s ease; }
    @keyframes type {
      0%, 100% { transform: translateY(0) scale(1); }
      12% { transform: translateY(6px) scale(0.94); }
      24% { transform: translateY(0) scale(1); }
      40% { transform: translateY(6px) scale(0.94); }
      52% { transform: translateY(0) scale(1); }
      68% { transform: translateY(6px) scale(0.94); }
      80% { transform: translateY(0) scale(1); }
    }
    .anim-fly { animation: fly 0.85s ease; }
    @keyframes fly {
      0% { transform: translate(0, 0) rotate(0) scale(1); }
      35% { transform: translate(36px, -24px) rotate(-18deg) scale(1.12); }
      65% { transform: translate(-14px, -8px) rotate(12deg) scale(1.05); }
      100% { transform: translate(0, 0) rotate(0) scale(1); }
    }
    .anim-bounce { animation: bounce 0.75s ease; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-24px) scale(1.14); }
      42% { transform: translateY(0) scale(1.08, 0.9); }
      58% { transform: translateY(-12px) scale(1.08); }
      75% { transform: translateY(0) scale(1); }
    }
    .anim-munch { animation: munch 0.7s ease; }
    @keyframes munch {
      0%, 100% { transform: scale(1, 1); }
      15% { transform: scale(1.18, 0.78); }
      30% { transform: scale(0.88, 1.16); }
      45% { transform: scale(1.14, 0.84); }
      60% { transform: scale(0.94, 1.1); }
      80% { transform: scale(1.06, 0.96); }
    }
    .anim-hug { animation: hug 0.8s ease; }
    @keyframes hug {
      0%, 100% { transform: scale(1) rotate(0); }
      25% { transform: scale(1.22) rotate(-7deg); }
      50% { transform: scale(1.16) rotate(7deg); }
      75% { transform: scale(1.24) rotate(-3deg); }
    }
    .anim-weather { animation: weatherwiggle 0.8s ease; }
    @keyframes weatherwiggle {
      0%, 100% { transform: rotate(0) scale(1); }
      20% { transform: rotate(-14deg) scale(1.15); }
      40% { transform: rotate(12deg) scale(1.1); }
      60% { transform: rotate(-8deg) scale(1.12); }
      80% { transform: rotate(6deg) scale(1.05); }
    }

    @media (orientation: landscape) and (min-width: 860px) {
      header.top { margin-bottom: 8px; }
      .day-panel { padding: 12px 14px 12px; }
      .days { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
      .day-name { font-size: clamp(40px, 5.6vw, 68px); }
      .card { min-height: 78px; padding: 10px 12px; }
      .icon-btn { width: 64px; height: 64px; font-size: 48px; }
      .wotd { margin-top: 8px; padding: 8px 14px 10px; }
      .wotd-emoji { width: 64px; height: 64px; font-size: 44px; }
      .letter { min-width: 34px; height: 40px; font-size: 20px; }
      .find-choice { width: 60px; height: 60px; font-size: 38px; }
      .find-btn { font-size: 18px; padding: 8px 16px; }
      .wotd-word-btn { font-size: 24px; }
      .find-row { margin-top: 8px; }
    }

    @media (max-width: 420px) {
      .nav-btn { width: 56px; height: 56px; font-size: 30px; }
      .speak-btn { width: 64px; height: 64px; font-size: 32px; }
      .icon-btn { width: 72px; height: 72px; font-size: 52px; }
      .card { min-height: 96px; gap: 10px; padding: 12px 12px; }
      .day-name { font-size: clamp(44px, 14vw, 72px); }
    }

    /* ---- Seasonal falling motifs (decorative, not tappable) ---- */
    .season-sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .flake {
      position: absolute;
      top: -12%;
      line-height: 1;
      pointer-events: none;
      animation-name: season-fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }
    @keyframes season-fall {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(16px, 55vh, 0) rotate(140deg); }
      100% { transform: translate3d(-8px, 112vh, 0) rotate(280deg); }
    }
    .season-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      background: rgba(255,255,255,0.88);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      padding: 6px 14px;
      margin-top: 6px;
      border-radius: 999px;
      box-shadow: 0 3px 0 rgba(31,58,95,0.12);
      cursor: pointer;
    }
    .season-badge:active, .season-badge.tapped { transform: scale(0.96); background: #FFF3A0; }

    /* ---- Word of the Day + Find it! ---- */
    .wotd {
      margin-top: 16px;
      background: rgba(255,255,255,0.5);
      border-radius: 32px;
      padding: 14px 16px 16px;
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 1;
    }
    .wotd-label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }
    .wotd-main { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .wotd-emoji {
      border: 0;
      background: #fff;
      width: 92px;
      height: 92px;
      font-size: 64px;
      border-radius: 26px;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
      flex-shrink: 0;
    }
    .wotd-emoji:active, .wotd-emoji.tapped { transform: scale(0.96); }
    .wotd-text { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .wotd-letters { display: flex; flex-wrap: wrap; gap: 6px; }
    .letter {
      min-width: 42px;
      height: 50px;
      padding: 0 8px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      font: inherit;
      font-size: 26px;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 0 4px 0 rgba(31,58,95,0.1);
      cursor: pointer;
      text-transform: uppercase;
    }
    .wotd-word-btn {
      font-size: clamp(26px, 4vw, 34px);
      padding: 4px 8px;
    }
    .find-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .find-btn {
      border: 0;
      background: #FFF176;
      color: var(--ink);
      font: inherit;
      font-size: 22px;
      font-weight: 800;
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 6px 0 #E8C200;
      cursor: pointer;
    }
    .find-btn:active, .find-btn.tapped { transform: translateY(2px); box-shadow: 0 4px 0 #E8C200; }
    .find-choices { display: flex; gap: 10px; flex-wrap: wrap; }
    .find-choice {
      width: 80px;
      height: 80px;
      border: 4px solid transparent;
      border-radius: 22px;
      background: #fff;
      font-size: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(31,58,95,0.1);
      font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
    }
    .find-choice.correct { border-color: #12B886; }
    .find-choice.wrong { border-color: #E63946; animation: wordpop 0.3s ease; }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 900;
    }
    .confetti-bit {
      position: absolute;
      pointer-events: none;
      font-size: 22px;
      animation: confetti-pop 1.1s ease-out forwards;
    }
    @keyframes confetti-pop {
      0% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(240deg) scale(0.55); opacity: 0; }
    }

</head>

      str(36, "data");
      view.setUint32(40, n * 2, true);
      let off = 44;
      for (let i = 0; i < n; i++) {
        const s = clamp(samples[i], -1, 1);
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        off += 2;
      }
      return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    }

    function mixAt(out, start, tone, gain) {
      const g = gain == null ? 1 : gain;
      for (let i = 0; i < tone.length; i++) {
        const j = start + i;
        if (j >= 0 && j < out.length) out[j] += tone[i] * g;
      }
    }

    function envSine(freq, seconds, peak, attack, decay, freqEnd) {
      const n = Math.floor(SR * seconds);
      const a = new Float32Array(n);
      const atk = Math.max(1, Math.floor(SR * (attack || 0.012)));
      const decStart = Math.max(atk, n - Math.floor(SR * (decay || seconds)));
      for (let i = 0; i < n; i++) {
        const t = i / SR;
        const f = freqEnd ? freq * Math.pow(freqEnd / freq, t / seconds) : freq;
        let e = peak;
        if (i < atk) e *= i / atk;
        else if (i > decStart) e *= Math.pow(0.0008, (i - decStart) / (n - decStart));
        a[i] = Math.sin(2 * Math.PI * f * t) * e;
      }
      return a;
    }

    function noiseBurst(seconds, peak, attack, decay, brown) {
      const n = Math.floor(SR * seconds);
      const a = new Float32Array(n);
      const atk = Math.max(1, Math.floor(SR * (attack || 0.008)));
      const decStart = Math.max(atk, n - Math.floor(SR * (decay || seconds * 0.7)));
      let y = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        if (brown) { y += 0.045 * (w - y); }
        let e = peak;
        if (i < atk) e *= i / atk;
        else if (i > decStart) e *= Math.pow(0.0008, (i - decStart) / Math.max(1, n - decStart));
        a[i] = (brown ? y * 4 : w) * e;
      }
      return a;
    }

    function softPlink(freq, seconds, peak) {
      const n = Math.max(1, Math.floor(SR * seconds));
      const a = new Float32Array(n);
      const atk = Math.max(1, Math.floor(SR * 0.02));
      const rel = Math.max(1, Math.floor(SR * 0.30));
      const relStart = Math.max(atk, n - rel);
      const p = peak == null ? 0.25 : peak;
      for (let i = 0; i < n; i++) {
        const t = i / SR;
        let e = p;
        if (i < atk) e *= 0.5 - 0.5 * Math.cos(Math.PI * (i / atk));
        else if (i > relStart) {
          const x = (i - relStart) / Math.max(1, n - relStart);
          e *= 0.5 + 0.5 * Math.cos(Math.PI * x);
        }
        a[i] = (Math.sin(2 * Math.PI * freq * t) + 0.16 * Math.sin(4 * Math.PI * freq * t)) * e;
      }
      return a;
    }

    function softChord(freqs, stagger) {
      const gap = stagger == null ? 0.08 : stagger;
      const total = 0.02 + (freqs.length - 1) * gap + 0.44;
      const out = new Float32Array(Math.floor(SR * total));
      freqs.forEach(function (f, i) {
        mixAt(out, Math.floor(SR * (0.02 + i * gap)), softPlink(f, 0.42, 0.25));
      });
      let peak = 0;
      for (let i = 0; i < out.length; i++) peak = Math.max(peak, Math.abs(out[i]));
      if (peak > 0.25) {
        const s = 0.25 / peak;
        for (let i = 0; i < out.length; i++) out[i] *= s;
      }
      return out;
    }

    const SOFT_TONES = {
      splash: [523.25, 659.25],
      bell: [392.00, 523.25, 659.25],
      keyboard: [440.00, 554.37],
      whoosh: [349.23, 440.00],
      chime: [659.25, 830.61],
      munch: [392.00, 493.88],
      happy: [523.25, 659.25, 783.99],
      intro: [587.33, 739.99],
      rain: [493.88, 622.25],
      wind: [329.63, 415.30],
      cheer: [523.25, 659.25, 783.99, 1046.5],
      oops: [392.00, 329.63]
    };

    function makeSamples(kind) {
      if (kind === "silent") return new Float32Array(Math.floor(SR * 0.12));
      const freqs = SOFT_TONES[kind];
      if (!freqs) return softPlink(523.25, 0.42, 0.25);
      const stagger = kind === "cheer" ? 0.10 : kind === "oops" ? 0.14 : 0.08;
      return softChord(freqs, stagger);
    }

    function makeAudioEl(url) {
      const a = new Audio();
      a.src = url;
      a.preload = "auto";
      a.playsInline = true;
      a.setAttribute("playsinline", "");
      a.setAttribute("webkit-playsinline", "");
      a.volume = 1;
      return a;
    }

    function buildSoundLibrary() {
      const kinds = ["silent","splash","bell","keyboard","whoosh","chime","munch","happy","intro","rain","wind","cheer","oops"];
      kinds.forEach((k) => {
        audioEls[k] = makeAudioEl(encodeWav(makeSamples(k)));
      });
    }

    function createOrResumeContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playSilentBuffer() {
      const ctx = createOrResumeContext();
      if (!ctx) return;
      try {
        const n = Math.max(1, Math.floor(ctx.sampleRate * 0.05));
        const buf = ctx.createBuffer(1, n, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const g = ctx.createGain();
        g.gain.value = 0.001;
        src.connect(g);
        g.connect(ctx.destination);
        src.start(0);
      } catch (e) {}
    }

    function unlockHtmlAudio(playKind) {
      Object.keys(audioEls).forEach((k) => {
        const a = audioEls[k];
        if (!a) return;
        if (k === playKind) return;
        try {
          a.volume = 0.01;
          const p = a.play();
          const reset = () => { try { a.pause(); a.currentTime = 0; } catch (e) {} a.volume = 1; };
          if (p && p.then) p.then(reset).catch(reset);
          else reset();
        } catch (e) { a.volume = 1; }
      });
    }

    function playSound(kind) {
      createOrResumeContext();
      playSilentBuffer();
      const el = audioEls[kind] || audioEls.intro;
      if (!el) return;
      try {
        el.pause();
        el.currentTime = 0;
        el.volume = 1;
        const p = el.play();
        if (p && p.catch) p.catch(() => playWebAudioFallback(kind));
      } catch (e) {
        playWebAudioFallback(kind);
      }
    }

    function playWebAudioFallback(kind) {
      const ctx = createOrResumeContext();
      if (!ctx) return;
      try {
        const samples = makeSamples(kind);
        const buf = ctx.createBuffer(1, samples.length, SR);
        buf.getChannelData(0).set(samples);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const g = ctx.createGain();
        g.gain.value = 0.85;
        src.connect(g);
        g.connect(ctx.destination);
        src.start(0);
      } catch (e) {}
    }

    function unlockAll(playKind, speakText) {
      createOrResumeContext();
      playSilentBuffer();
      if (speakText) speakNow(speakText);
      unlockHtmlAudio(playKind);
      if (playKind) playSound(playKind);
      else if (audioEls.silent) {
        try { audioEls.silent.volume = 1; audioEls.silent.currentTime = 0; audioEls.silent.play().catch(function(){}); } catch (e) {}
      }
      audioReady = true;
    }

    /* ---------- speech (must be called directly in the tap handler) ---------- */
    let chosenVoice = null;

    function pickVoice() {
      const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      if (!voices || !voices.length) return null;
      const enUS = voices.filter((v) => /en-US/i.test(v.lang));
      const pool = enUS.length ? enUS : voices.filter((v) => /^en/i.test(v.lang));
      return pool.find((v) => /Samantha|Jenny|Karen|siri|Female|Google US English/i.test(v.name)) || pool[0] || null;
    }

    let voicesReady = false;
    function refreshVoice() {
      const v = pickVoice();
      if (v) {
        chosenVoice = v;
        voicesReady = true;
      } else {
        chosenVoice = null;
        voicesReady = !!(window.speechSynthesis && speechSynthesis.getVoices && speechSynthesis.getVoices().length);
        if (!voicesReady) chosenVoice = null;
      }
    }
    if (window.speechSynthesis) {
      refreshVoice();
      speechSynthesis.addEventListener("voiceschanged", refreshVoice);
    }

    /* Spoken audio: pre-generated MP3s (en-US-AnaNeural), played on the
       same unlocked HTML5 <audio> element used after "Tap to start".
       speechSynthesis is a last-resort fallback only if a clip is missing. */
    let voiceEl = null;
    let voiceQueue = [];

    function slugify(text) {
      return String(text).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function clipUrl(text) {
      const raw = String(text).trim();
      if (!raw) return null;
      if (/^[A-Za-z]$/.test(raw)) return AUDIO_CLIPS[raw.toLowerCase()] || ("audio/letters/" + raw.toLowerCase() + ".mp3");
      const s = slugify(raw);
      return (s && AUDIO_CLIPS[s]) || null;
    }

    function ensureVoiceEl() {
      if (!voiceEl) {
        voiceEl = new Audio();
        voiceEl.preload = "auto";
        voiceEl.playsInline = true;
        voiceEl.setAttribute("playsinline", "");
        voiceEl.setAttribute("webkit-playsinline", "");
        voiceEl.volume = 1;
      }
      return voiceEl;
    }

    function playVoiceNext() {
      const a = ensureVoiceEl();
      if (!voiceQueue.length) {
        a.onended = null;
        a.onerror = null;
        return;
      }
      const src = voiceQueue.shift();
      a.onended = function () { playVoiceNext(); };
      a.onerror = function () { playVoiceNext(); };
      try {
        a.src = src;
        const p = a.play();
        if (p && p.catch) p.catch(function () { playVoiceNext(); });
      } catch (e) {
        playVoiceNext();
      }
    }

    function playVoiceQueue(srcs) {
      voiceQueue = srcs.slice();
      const a = ensureVoiceEl();
      try { a.pause(); } catch (e) {}
      a.onended = null;
      a.onerror = null;
      playVoiceNext();
    }

    function speakFallback(text) {
      if (!window.speechSynthesis || !text) return;
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text));
        u.lang = "en-US";
        u.rate = 0.9;
        u.volume = 1;
        if (voicesReady && chosenVoice) u.voice = chosenVoice;
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    function speakNow(text) {
      if (!text) return;
      const raw = String(text).trim();
      const exact = clipUrl(raw);
      if (exact) {
        playVoiceQueue([exact]);
        return;
      }
      const clauses = raw.split(/[.!?]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      const srcs = [];
      clauses.forEach(function (clause) {
        const whole = clipUrl(clause);
        if (whole) {
          srcs.push(whole);
          return;
        }
        clause.split(/\s+/).forEach(function (w) {
          const u = clipUrl(w);
          if (u) srcs.push(u);
        });
      });
      if (srcs.length) playVoiceQueue(srcs);
      else speakFallback(raw);
    }

    function popTap(el) {
      if (!el) return;
      el.classList.remove("tapped");
      void el.offsetWidth;
      el.classList.add("tapped");
      setTimeout(function () { el.classList.remove("tapped"); }, 350);
    }

    function daySpeech(when, info, wx) {
      let parts = [when + ".", info.dayName + "."];
      if (wx) parts.push(wx.word + ".", wx.feel + ".");
      info.activities.forEach((a) => parts.push(a.speech + "."));
      return parts.join(" ").replace(/\.+/g, ".").replace(/\s+\./g, ".");
    }

    /* ---------- weather (Open-Meteo, Lowell, MI) ---------- */
    let weatherByDate = null;

    function conditionFromCode(code) {
      const c = Number(code);
      if (c === 0 || c === 1) return { emoji: "☀️", word: "Sunny", sound: "wind" };
      if (c === 2 || c === 3) return { emoji: "☁️", word: "Cloudy", sound: "wind" };
      if (c === 45 || c === 48) return { emoji: "🌫️", word: "Foggy", sound: "wind" };
      if ([71, 73, 75, 77, 85, 86].indexOf(c) >= 0) return { emoji: "❄️", word: "Snowy", sound: "wind" };
      if ([95, 96, 99].indexOf(c) >= 0) return { emoji: "⛈️", word: "Stormy", sound: "rain" };
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].indexOf(c) >= 0) return { emoji: "🌧️", word: "Rainy", sound: "rain" };
      return { emoji: "☁️", word: "Cloudy", sound: "wind" };
    }

    function feelFromHigh(t) {
      if (t >= 80) return "Hot";
      if (t >= 65) return "Warm";
      if (t >= 50) return "Cool";
      if (t >= 32) return "Cold";
      return "Freezing";
    }

    function parseWeather(json) {
      const daily = json && json.daily;
      if (!daily || !daily.time) return null;
      const codes = daily.weather_code || daily.weathercode || [];
      const highs = daily.temperature_2m_max || [];
      const days = {};
      daily.time.forEach((date, i) => {
        const cond = conditionFromCode(codes[i]);
        const high = highs[i];
        days[date] = {
          emoji: cond.emoji,
          word: cond.word,
          sound: cond.sound,
          feel: (high == null || isNaN(high)) ? "" : feelFromHigh(high),
          high: high
        };
      });
      return { fetchedAt: Date.now(), days: days };
    }

    function loadCachedWeather() {
      try {
        const raw = localStorage.getItem(WEATHER_CACHE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data && data.days) return data;
      } catch (e) {}
      return null;
    }

    function loadWeather() {
      const cached = loadCachedWeather();
      if (cached) {
        weatherByDate = cached.days;
        render();
      }
      fetch(WEATHER_URL)
        .then((r) => { if (!r.ok) throw new Error("http"); return r.json(); })
        .then((json) => {
          const parsed = parseWeather(json);
          if (!parsed) throw new Error("parse");
          try { localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(parsed)); } catch (e) {}
          weatherByDate = parsed.days;
          render();
        })
        .catch(() => {
          if (!cached) {
            weatherByDate = null;
            render();
          }
        });
    }

    /* ---------- UI helpers ---------- */
    function animateIcon(el, anim) {
      const cls = "anim-" + anim;
      el.classList.remove(cls);

      el.classList.add(cls);
      el.addEventListener("animationend", () => el.classList.remove(cls), { once: true });

    function addWord(parent, text, extraClass) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "word" + (extraClass ? " " + extraClass : "");

      b.addEventListener("click", function () {

        speakNow(text);
      });
      parent.appendChild(b);
      return b;
    }

    function addWords(parent, phrase, extraClass) {
      phrase.split(/\s+/).forEach((w) => addWord(parent, w, extraClass));
    }

    function makeCard(activity) {

    function makeWeather(wx) {

    function makePanel(info, today, isSecondary) {

    let offset = 0;

    /* ---------- Word of the Day + seasons ---------- */
    function verifyWordList(list) {
      if (!list || list.length !== 365) throw new Error("WORD_LIST must have 365 entries");
      const words = new Set();
      const emojis = new Set();
      const pairs = new Set();
      list.forEach(function (item) {
        const w = item[0], e = item[1];
        const pair = w + "\t" + e;
        if (words.has(w) || emojis.has(e) || pairs.has(pair)) throw new Error("duplicate " + w + " " + e);
        words.add(w); emojis.add(e); pairs.add(pair);
      });
    }
    verifyWordList(WORD_LIST);

    function dayOfYear(key) {
      const p = key.split("-").map(Number);
      const start = Date.UTC(p[0], 0, 1, 12);
      const now = Date.UTC(p[0], p[1] - 1, p[2], 12);
      return Math.round((now - start) / 86400000) + 1;
    }

    function todaysWord() {
      const idx = (dayOfYear(todayKey()) - 1) % WORD_LIST.length;
      return { word: WORD_LIST[idx][0], emoji: WORD_LIST[idx][1], index: idx };
    }

    function currentSeason(key) {
      const month = Number((key || todayKey()).split("-")[1]);
      if (month === 12 || month <= 2) return { id: "winter", name: "Winter", emoji: "❄️", flakes: ["❄️"] };
      if (month <= 5) return { id: "spring", name: "Spring", emoji: "🌸", flakes: ["🌸", "🌼"] };
      if (month <= 8) return { id: "summer", name: "Summer", emoji: "☀️", flakes: ["☀️"] };
      return { id: "fall", name: "Fall", emoji: "🍂", flakes: ["🍂", "🍁"] };
    }

    function applySeason() {
      const s = currentSeason(todayKey());
      document.body.classList.remove("season-winter", "season-spring", "season-summer", "season-fall");
      document.body.classList.add("season-" + s.id);
      const badge = document.getElementById("seasonBadge");
      badge.textContent = s.emoji + "  " + s.name;
      badge.setAttribute("aria-label", s.name);
      badge.addEventListener("click", function () {

    function burstConfetti(originEl) {
      const layer = document.getElementById("confetti");
      if (!layer) return;
      const rect = originEl ? originEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const bits = ["🎉", "✨", "⭐", "🎊", "💛", "🧡"];
      for (let i = 0; i < 18; i++) {
        const bit = document.createElement("span");
        bit.className = "confetti-bit";
        bit.textContent = bits[i % bits.length];
        bit.style.left = cx + "px";
        bit.style.top = cy + "px";
        bit.style.setProperty("--dx", (Math.random() * 280 - 140) + "px");
        bit.style.setProperty("--dy", (Math.random() * -220 - 40) + "px");
        layer.appendChild(bit);
        setTimeout(function () { bit.remove(); }, 1200);
      }
    }

    function renderWordOfDay() {
      const root = document.getElementById("wotd");
      const item = todaysWord();
      const display = item.word.charAt(0).toUpperCase() + item.word.slice(1);
      root.innerHTML = "";

      const label = document.createElement("div");
      label.className = "wotd-label";
      label.textContent = "Word of the Day";
      root.appendChild(label);

      const main = document.createElement("div");
      main.className = "wotd-main";

      const emo = document.createElement("button");
      emo.type = "button";
      emo.className = "wotd-emoji";
      emo.id = "wotdEmoji";
      emo.setAttribute("aria-label", display);
      emo.textContent = item.emoji;
      emo.addEventListener("click", function () {
        popTap(emo);
        animateIcon(emo, "bounce");
        speakNow(item.word);
        playSound("happy");
      });

      const textCol = document.createElement("div");
      textCol.className = "wotd-text";
      const letters = document.createElement("div");
      letters.className = "wotd-letters";
      item.word.split("").forEach(function (ch) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "letter word";
        b.textContent = ch.toUpperCase();
        b.addEventListener("click", function () {
          popTap(b);
          speakNow(ch.toUpperCase());
        });
        letters.appendChild(b);
      });

      const wordBtn = document.createElement("button");
      wordBtn.type = "button";
      wordBtn.className = "word wotd-word-btn";
      wordBtn.textContent = display;
      wordBtn.addEventListener("click", function () {
        popTap(wordBtn);
        speakNow(item.word);
      });

      textCol.appendChild(letters);
      textCol.appendChild(wordBtn);
      main.appendChild(emo);
      main.appendChild(textCol);
      root.appendChild(main);

      const findRow = document.createElement("div");
      findRow.className = "find-row";
      const findBtn = document.createElement("button");
      findBtn.type = "button";
      findBtn.className = "find-btn";
      findBtn.textContent = "Find it!";
      const choices = document.createElement("div");
      choices.className = "find-choices";

      function showChoices() {
        const others = [];
        const used = new Set([item.word]);
        while (others.length < 2) {
          const j = Math.floor(Math.random() * WORD_LIST.length);
          const cand = WORD_LIST[j];
          if (used.has(cand[0])) continue;
          used.add(cand[0]);
          others.push(cand);
        }
        const opts = [{ word: item.word, emoji: item.emoji, ok: true }].concat(
          others.map(function (pair) { return { word: pair[0], emoji: pair[1], ok: false }; })
        );
        for (let i = opts.length - 1; i > 0; i--) {
          const k = Math.floor(Math.random() * (i + 1));
          const tmp = opts[i]; opts[i] = opts[k]; opts[k] = tmp;
        }
        choices.innerHTML = "";
        emo.style.visibility = "hidden";
        opts.forEach(function (opt) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "find-choice";
          b.textContent = opt.emoji;
          b.setAttribute("aria-label", opt.word);
          b.addEventListener("click", function () {
            if (opt.ok) {
              popTap(b);
              b.classList.add("correct");
              speakNow("Great job. " + item.word);
              playSound("cheer");
              burstConfetti(b);
              emo.style.visibility = "visible";
            } else {
              popTap(b);
              b.classList.add("wrong");
              speakNow("Try again.");
              playSound("oops");
              setTimeout(function () { b.classList.remove("wrong"); }, 400);
            }
          });
          choices.appendChild(b);
        });
      }

      findBtn.addEventListener("click", function () {
        popTap(findBtn);
        speakNow("Find it. " + item.word);
        showChoices();
      });

      findRow.appendChild(findBtn);
      findRow.appendChild(choices);
      root.appendChild(findRow);
    }

    buildSoundLibrary();
    ensureVoiceEl();
    applySeason();
    render();
    renderWordOfDay();
    loadWeather();

    /* preview=1 skips the start overlay (used for screenshots only) */
    if (/[?&]preview=1\b/.test(location.search)) {
      started = true;
      document.getElementById("unlock").style.display = "none";
    }
  </script>
</body>
</html>
